services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecogoodz-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "EcoGoodz!Dev2026"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./backup:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-restore:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecogoodz-db-restore
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./backup:/var/opt/mssql/backup
      - ./db:/db
    entrypoint: ["/bin/bash", "/db/restore.sh"]
    environment:
      MSSQL_SA_PASSWORD: "EcoGoodz!Dev2026"

volumes:
  sqlserver-data:
